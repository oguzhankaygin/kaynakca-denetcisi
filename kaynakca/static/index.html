<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kaynakça Denetçisi</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main>
    <header>
      <h1>Kaynakça Denetçisi</h1>
      <button id="theme" type="button" aria-pressed="false">Koyu tema</button>
    </header>
    <p>Kaynakçanızın biçimini denetleyin ve elle doğrulama bağlantılarını alın.</p>
    <form id="audit">
      <label for="input">Kaynakça</label>
      <p id="help">Her kaynağı ayrı satıra yazın veya BibTeX içeriğini yapıştırın.</p>
      <textarea id="input" rows="9" aria-describedby="help" required></textarea>
      <button type="submit">Denetle</button>
    </form>
    <p id="status" role="status"></p>
    <section id="report" aria-label="Denetim raporu"></section>
  </main>
</body>
</html>
